name: Build executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Tcl/Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-tk xvfb xauth
      - name: Test source and GUI
        run: |
          python -m pip install -r requirements-build.txt
          python -m unittest discover -s tests -v
          xvfb-run -a python tests/smoke_gui.py
      - name: Download AppImage tools
        run: |
          mkdir -p build-appimage
          curl -fL --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o build-appimage/appimagetool
          curl -fL --retry 3 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o build-appimage/runtime-x86_64
          chmod +x build-appimage/appimagetool
      - name: Build AppImage
        run: ./build_appimage.sh
      - name: Test packaged backend
        run: APPIMAGE_EXTRACT_AND_RUN=1 python tests/smoke_app.py ./PS4PkgExtractor-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: PS4PkgExtractor-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Test source and GUI
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/smoke_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        shell: pwsh
        run: ./build_windows.ps1
      - name: Test packaged backend
        shell: pwsh
        run: |
          python tests/smoke_windows_gui.py ./build-windows/dist/PS4PkgExtractor-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-executable
          path: build-windows/dist/PS4PkgExtractor-windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.AppImage *.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
          else
            gh release create "$RELEASE_TAG" release/*.AppImage release/*.exe release/SHA256SUMS.txt \
              --verify-tag --title "PS4 PKG Extractor $RELEASE_TAG" --generate-notes
          fi
